<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experience - Saud Qattan</title>
  <meta name="description" content="Professional experience and timeline of Saud Qattan.">
  <link rel="icon" type="image/jpeg" href="resources/icons/SaudQXX.jpeg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand font-bold text-lg">
        <a href="index.html" class="brand-text">SaudQXX</a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link" data-i18n="nav_home">Home</a></li>
        <li><a href="projects.html" class="nav-link" data-i18n="nav_projects">Projects</a></li>
        <li><a href="experience.html" class="nav-link" data-i18n="nav_experience">Experience</a></li>
        <li><a href="contact.html" class="nav-link" data-i18n="nav_contact">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <button id="lang-switch" class="lang-switch">العربية</button>
        <a href="#" class="icon-btn" data-link="github" title="GitHub">
          <svg class="glow-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </a>
      </div>
    </div>
  </nav>

  <!-- Experience Section -->
  <main class="section page-main">
    <div class="container">
      <h1 class="section-title reveal slide-up" data-i18n="experience_title" style="text-align: center;">Professional Experience</h1>
      
      <h2 class="section-title reveal slide-up" data-i18n="experience_main_title" style="text-align: center; margin-top: 3rem; margin-bottom: 2rem;">Main Experience</h2>
      <!-- Container for dynamic main experience -->
      <div id="main-experience-grid" class="projects-grid"></div>

      <div style="margin-top: 5rem;"></div>

      <h2 class="section-title reveal slide-up" data-i18n="experience_secondary_title" style="text-align: center; margin-bottom: 2rem;">Secondary Experience & Certifications</h2>
      <!-- Container for dynamic secondary experience -->
      <div id="secondary-experience-grid" class="projects-grid"></div>
    </div>
  </main>

  <!-- Certificate Preview Modal -->
  <div id="certificate-modal" class="modal-overlay">
    <div class="modal-content" style="max-width: 800px; padding: 1.5rem; background: var(--bg-card); display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 90%;">
      <button class="modal-close" onclick="closeCertModal()" style="font-size: 2rem; top: 0.75rem; right: 0.75rem; background: none; border: none; color: var(--text-secondary); cursor: pointer;">&times;</button>
      <h3 id="cert-modal-title" style="font-size: 1.3rem; font-weight: 600; margin-bottom: 1rem; color: var(--accent-gold); text-align: center; width: 100%; padding-right: 2rem;"></h3>
      <div style="width: 100%; max-height: 70vh; overflow-y: auto; border-radius: 8px; border: 1px solid var(--border-color); background: #080808; display: flex; align-items: center; justify-content: center; padding: 1rem; position: relative;">
        <img id="cert-modal-img" src="" alt="Certificate Preview" style="max-width: 100%; max-height: 65vh; object-fit: contain;" onerror="this.style.display='none'; document.getElementById('cert-modal-error').style.display='block';">
        <div id="cert-modal-pdf-container" style="display: none; width: 100%;"></div>
        <div id="cert-modal-error" style="display: none; text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 1rem; color: var(--text-muted); display: inline-block;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          <p style="font-size: 1rem; font-weight: 500; color: var(--text-secondary);" data-i18n="cert_not_found">المستند غير متوفر حالياً أو لم يتم رفعه بعد</p>
          <p style="font-size: 0.8rem; margin-top: 0.5rem; font-family: monospace;" id="cert-modal-error-path"></p>
        </div>
      </div>
      <div style="margin-top: 1rem; width: 100%; display: flex; justify-content: flex-end; gap: 1rem;">
        <a id="cert-modal-download" href="#" target="_blank" download class="btn-primary" style="font-size: 0.85rem; padding: 0.55rem 1.2rem; border-radius: 6px; display: inline-flex; align-items: center; gap: 0.35rem; text-decoration: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span data-i18n="btn_download">فتح المستند بالكامل</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div>&copy; <span data-text="year"></span> Saud Turki Qattan</div>
      <div class="footer-socials">
        <a href="#" data-link="github" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="#" data-link="discord" target="_blank" rel="noopener noreferrer">Discord</a>
      </div>
    </div>
  </footer>

  <script src="js/language.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>
